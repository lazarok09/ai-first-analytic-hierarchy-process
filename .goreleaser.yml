version: 2

project_name: ahp

before:
  hooks:
    - go mod tidy

builds:
  - id: ahp
    main: ./cmd/ahp
    binary: ahp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Release body comes from goreleaser/chglog via --release-notes in CI.
changelog:
  disable: true

release:
  draft: false
  prerelease: auto
